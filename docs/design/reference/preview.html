.brand strong{white-space:nowrap}
.breadcrumb,.chat-heading,.context-header h3,.card-head-title,.status-pill,.tiny-pill,.btn-primary,.btn-outline,.file-action{white-space:nowrap}
.file-action{flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.context-panel{position:relative}
.context-panel:has(.panel-bottom) .context-scroll{padding-bottom:145px}
.panel-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;box-shadow:0 -5px 14px rgba(251,248,244,.92)}
@media(max-width:1250px){.brand{min-width:142px}}
@media(max-width:1060px){.brand{min-width:110px}}

/* Legible color corrections: keep flavor without using beige-on-beige for essential text */
:root{--muted:#79665b;--muted-light:#806b5e;--accent:#9b654a;--accent-hover:#865139}
.breadcrumb,.sidebar-label,.session-entry,.card-description,.message-meta,.file-path,.file-match,.aside-sub,.note,.setup-content p,.scope,.stat small,.timeline-row span,.plan-target,.plan-index,.result-row span,.panel-caption,.input-hint,.hint-row,.hero p,.companion-card p,.sidebar-footer,.plan-status,.file-action{color:#79665b}
.composer textarea::placeholder{color:#857367}
.sidebar-label,.context-scroll .aside-sub{font-size:11px}

/* V1.2 — 本轮设计交付优化：不再使用近似重画的一二布布 SVG */
.hero-scene{position:absolute;inset:0 0 0 auto;width:48%;display:flex;align-items:center;justify-content:center}
.hero-scene:before{content:"";position:absolute;width:245px;height:245px;border-radius:50%;background:#fff7ed9c;right:14px;top:17px;box-shadow:inset 0 0 0 1px #f7e4d4}
.scene-doodle{position:absolute;display:flex;gap:8px;align-items:center;background:#fffefd;border:1px solid #ebd9c9;box-shadow:0 6px 16px #a46c3920;border-radius:12px;padding:10px 12px;font-size:12px;color:#986745;z-index:1}
.scene-doodle .icon{width:17px;height:17px;color:#bc805c}
.scene-doodle-one{right:18px;top:43px;transform:rotate(7deg)}
.scene-doodle-two{right:135px;bottom:36px;transform:rotate(-10deg)}
.scene-duo{position:relative;z-index:2;margin-top:9px;display:flex;align-items:end;gap:7px;justify-content:center;transform:translateX(12px)}
.scene-duo img{width:76px;height:88px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 6px 7px #8b61431c)}
.scene-label{font-size:9px;color:#8d7262;position:absolute;right:14px;bottom:11px;z-index:3;background:#fff8f0e8;border-radius:18px;padding:4px 8px}
.sidebar .companion-card img{width:102px;height:64px;mix-blend-mode:multiply;object-fit:contain}
.brand-mascot,.header-avatar img,.avatar img,.process-hero img,.mascot-aside img{mix-blend-mode:multiply;object-fit:contain}
.brand-mascot{width:44px;max-height:33px}
.header-avatar img{width:32px;height:32px;transform:none}
.avatar img{width:31px;height:32px;transform:none}
.process-hero img{width:92px;height:94px;transform:none;object-fit:contain;margin-right:4px}
.mascot-aside img{width:95px;height:74px}
.mascot-aside{padding:12px;min-height:124px}
.panel-collapsed .context-panel{display:none}
.panel-toggle{margin-left:auto;margin-right:12px;height:32px;padding:6px 10px;font-size:11px}
.chat-heading-sub{overflow:hidden;text-overflow:ellipsis;max-width:210px;white-space:nowrap}
.files-section{background:#fff;border:1px solid var(--border);border-radius:18px;padding:21px;box-shadow:var(--shadow-sm)}
.files-intro .section-label{font-size:11px;color:#a37257;font-weight:650;display:flex;align-items:center;gap:8px}
.files-intro h2{font-size:21px;margin:10px 0 5px}
.files-intro p{font-size:13px;margin:0 0 17px;color:#786558;line-height:1.65}
.file-list-heading{display:grid;grid-template-columns:minmax(0,1fr) 84px 74px;color:#7b6555;font-size:12px;padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:5px}
.browser-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #f0e8df}
.browser-row .file-icon{flex-shrink:0;width:34px;height:36px}
.browser-name{font-size:13px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser-kind{font-size:12px;color:#91796a;width:74px;flex-shrink:0}
.browser-row .btn-neutral{width:70px;justify-content:center;flex-shrink:0}
/* 最小可读性：核心交互字号优先于 AI 概念图中的装饰性微小文字。 */
.compose-tool,.file-action,.aside-sub,.note,.card-description,.setup-content p,.plan-target,.result-row span,.session-entry,.hint-row,.tool-step,.plan-file,.plan-status,.file-path,.file-match,.suggest p,.status-pill,.stat small,.sidebar-footer,.panel-caption,.progress-label,.timeline-row span{font-size:12px}
.composer textarea{font-size:14px}
.bubble{font-size:14px}
.card-head-title,.aside-title,.context-header h3{font-size:14px}
.nav-btn{font-size:14px}
.input-hint{font-size:11px}
.plan-target{overflow:hidden;text-overflow:ellipsis}
@media(max-width:1250px){.hero-scene{width:47%}.scene-label{display:none}.scene-duo img{width:66px;height:74px}}
@media(max-width:1060px){.brand-mascot{display:none}.hero-scene{width:47%}.scene-doodle-one{right:6px}.scene-doodle-two{right:93px}.scene-duo img{width:54px;height:65px}}
@media(max-width:930px){.context-panel{width:320px}.scene-label{display:none}.chat-heading-sub{display:none}}

.online-dot.offline{background:#b7a89c}
.plan-item{display:flex;flex-direction:column;gap:0}
.plan-row-btn{width:100%;text-align:left;cursor:pointer;font:inherit}
.plan-row-btn:hover{border-color:#d6b298;background:#fff9f2}
.plan-row-btn .icon.sm{width:13px;height:13px;color:#ac8f79;transition:transform .15s}
.plan-row-btn[aria-expanded="true"] .icon.sm{transform:rotate(180deg)}
.plan-details{margin:0 7px 9px;padding:11px 11px 13px;border-radius:0 0 10px 10px;background:#fff9f1;border:1px solid #eddaca;border-top:0;display:flex;flex-direction:column;gap:9px}
.plan-details div{display:flex;flex-direction:column;gap:4px}
.plan-details strong{font-size:11px;color:#8e6046}
.plan-details span{font-size:12px;color:#675449;line-height:1.45;overflow-wrap:anywhere;user-select:text}
/* Visual QA: normal-size status/secondary labels use darker ink for readability. */
.status-pill{color:#7f503a}
.status-pill.done{color:#32694a}
.status-pill.pending{color:#805426}
.tiny-pill{color:#71594a}
.plan-status{color:#745543}
.plan-status.skip{color:#805426}
.stat.success strong{color:#397652}
.stat.warning strong{color:#8f602c}
.setup-num{color:#745342}

function ico(name,cls=''){return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" class="icon ${cls}">${icons[name]||icons.bullet}</svg>`}
function asset(name){return referenceMap[name] || referenceMap['idle']}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toolStep(text,kind='done',meta=''){
 const marker=kind==='done'?`<span class="step-check">${ico('check','sm')}</span>`:kind==='active'?`<span class="step-active">${ico('loader','sm')}</span>`:`<span class="step-idle"></span>`;
 return `<div class="tool-step">${marker}<span style="flex:1">${text}</span>${meta?`<span style="color:#ae998b;font-size:10px">${meta}</span>`:''}</div>`;
}
function message(text,who='ai',time='14:02'){
 const user=who==='user';return `<div class="message ${user?'user':''}"><div class="avatar ${user?'user':''}">${user?ico('monitor','lg'):`<img alt="布布" src="${asset('working')}">`}</div><div class="message-body"><div class="bubble ${user?'user':'ai'}">${text}</div><div class="message-meta">${time}${user?'':' · Bubu AI'}</div></div></div>`;
}
function fileIcon(name){const ext=name.split('.').pop()?.toLowerCase();const cl=ext==='pdf'?'pdf':ext==='md'?'md':ext==='zip'?'zip':ext==='txt'?'txt':'md';const ic=ext==='zip'?'archive':'file';return `<div class="file-icon ${cl}">${ico(ic)}</div>`}
function fileCard(name,path,extra=''){
 return `<div class="file-result">${fileIcon(name)}<div class="file-main"><div class="file-name">${esc(name)}</div><div class="file-path">${esc(path)}</div>${extra?`<div class="file-match">${esc(extra)}</div>`:''}</div><button class="file-action" data-action="show-location" aria-label="查看 ${esc(name)} 所在位置">${ico('external','sm')} 定位</button></div>`;
}
function panelCard(title,content){return `<section class="aside-card"><div class="aside-title">${title}</div>${content}</section>`}
function tinyMascot(which,caption){return `<div class="mascot-aside"><img alt="一二布布角色状态：${esc(caption)}" src="${asset(which)}"><p>${esc(caption)}</p></div>`}
function sidebar(active){
 const main=[['工作台','home','welcome'],['新对话','plus','welcome'],['最近会话','message','chat'],['文件空间','folder','files'],['任务记录','clock','completed']];
 const nav=main.map(([name,icon,target])=>`<button class="nav-btn ${active===target&&name==='工作台'?'active':''}" data-view="${target}" title="${name}">${ico(icon)}<span>${name}</span></button>`).join('');
 return `<aside class="sidebar"><div><div class="sidebar-label">工作空间</div>${nav}<div class="sidebar-separator"></div><div class="sidebar-label">最近任务</div><div class="session-entry">${ico('search','sm')}查找 NestJS 权限文档</div><div class="session-entry">${ico('folder','sm')}整理 Downloads 目录</div></div><div class="sidebar-grow"></div><div class="companion-card"><p>和布布一起<br>把文件变得井井有条 ♡</p><img alt="一二布布并肩相伴" src="${asset('idle')}"></div><div class="sidebar-footer">设计预览 · 仅示例数据</div></aside>`;
}
function header(view){const v=views[view];return `<header class="window-bar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><img class="brand-mascot" src="${asset('brand-duo')}" alt="一二布布"><strong>Bubu AI</strong><span class="brand-badge">本地 AI 工作伙伴</span></div><div class="breadcrumb">工作台 ${ico('right','sm')} <strong>${v.header}</strong></div><div class="header-spacer"></div><span class="preview-mark">交互设计稿 · 示例数据</span><select id="view-switch" class="state-select" aria-label="切换设计稿状态">${Object.entries(views).map(([k,obj])=>`<option value="${k}" ${k===view?'selected':''}>${obj.name}</option>`).join('')}</select><div class="top-model"><span class="online-dot ${view==='welcome'?'offline':''}"></span>${view==='welcome'?'尚未连接模型':'演示模型 · 已配置'}</div><div class="header-avatar"><img src="${asset('working')}" alt="布布头像"></div></header>`;}
function compose(){return `<div class="input-shell"><div class="composer"><textarea id="mock-input" aria-label="对话输入（原型）" placeholder="给布布发送消息，或描述你想完成的文件任务..."></textarea><div class="composer-toolbar"><button class="compose-tool" data-action="pick-folder">${ico('paperclip','sm')} 添加文件</button><button class="compose-tool" data-action="permissions">${ico('shield','sm')} 授权目录</button><div class="composer-spacer"></div><span class="compose-model">示例模型 ${ico('chevron','sm')}</span><button data-action="send-mock" title="演示发送" aria-label="演示发送" class="send-btn">${ico('send','sm')}</button></div></div><div class="input-hint">仅 UI 交互原型 · 不会连接模型或访问本地文件</div></div>`}

function rightFiles(){return `${panelCard(`${ico('folder')} 当前授权目录`, `<div class="scope">${ico('folder','sm')} ~/Documents/Notes</div><div class="aside-sub">只读授权 · 演示数据，不是真实目录权限。</div>`) }${panelCard(`${ico('file')} 文件信息`, `<div class="aside-sub">点击文件查看详情（生产版本），展示文件名称、格式、大小、修改时间、所在目录与可用操作。</div>`) }${tinyMascot('idle','文件都在这里，慢慢找就好 ♡')}`}

function asideFooter(view){if(view==='approval')return `<div class="panel-bottom"><div class="buttons"><button class="btn-outline" data-action="cancel-plan">取消</button><button class="btn-primary" data-action="approve-plan">${ico('check','sm')} 确认执行 6 项</button></div><div class="panel-caption">仅原型：点击会切换为结果演示，不会修改本地文件。</div></div>`;

return ''}
function layout(view){const v=views[view];return `<div class="stage"><main class="window">${header(view)}<div class="app-layout ${panelOpen?'':'panel-collapsed'}">${sidebar(view)}<section class="chat-area"><div class="chat-title-row"><div class="chat-heading">${ico(v.icon)} ${v.header} <span class="chat-heading-sub">${view==='welcome'?'· 让每件小事更轻松':view==='chat'||view==='files'?'· 示例授权目录':`· ${sampleRoot}`}</span></div><span class="tiny-pill">${view==='welcome'?'需要完成首次配置':view==='chat'?'只读查询':view==='files'?'文件列表演示':view==='analyzing'?'只读分析中':view==='approval'?'待用户审批':'操作已核对'}</span><button class="btn-neutral panel-toggle" data-action="toggle-panel" aria-label="切换右侧面板">${ico('list','sm')} ${panelOpen?'收起面板':'查看面板'}</button></div><div class="chat-scroll">${leftContent(view)}</div>${compose()}</section><aside class="context-panel"><header class="context-header"><h3>${ico(v.icon)} ${v.panel}</h3><button class="icon-btn" data-action="panel-info" title="面板说明">${ico('info','sm')}</button></header><div class="context-scroll">${rightContent(view)}</div>${asideFooter(view)}</aside></div></main></div><div id="toast" role="status" class="toast"></div>`}
let expandedRow = null;
let panelOpen = true;
let currentView = new URLSearchParams(location.search).get('view') || 'welcome';
if(!views[currentView])currentView='welcome';
function render(){document.getElementById('app').innerHTML=layout(currentView);document.title=`Bubu AI · ${views[currentView].name} · 工程化设计 V1.2`}
function setView(v){if(!views[v])return;if(v!==currentView)expandedRow=null;currentView=v;const url=new URL(location.href);url.searchParams.set('view',v);if(location.protocol==='http:'||location.protocol==='https:'||location.protocol==='file:')history.replaceState({},'',url);render()}
let toastTimer;
function notify(text){const toast=document.getElementById('toast');if(!toast)return;toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast?.classList.remove('show'),3500)}
document.addEventListener('change',e=>{if(e.target?.id==='view-switch')setView(e.target.value)});
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-view],[data-action]');if(!target)return;
 if(target.dataset.view){setView(target.dataset.view);return}
 const action=target.dataset.action;
 if(action==='approve-plan'){setView('completed');notify('设计演示：跳转查看执行结果界面；实际没有移动任何文件。')}
 else if(action==='cancel-plan'){setView('welcome');notify('设计演示：已拒绝方案，没有任何文件修改。')}
 else if(action==='stop-run'){setView('welcome');notify('演示：任务已停止。真实产品会保存已完成与未执行操作的状态。')}
 else if(action==='send-mock'){notify('这是视觉交互原型。正式产品的对话和任务将在开发阶段接入。')}
 else if(action==='pick-folder'){notify('本原型不会访问磁盘。真实产品通过 Electron 系统目录选择器授权。')}
 else if(action==='permissions'){notify('正式产品会显示当前授权目录及撤销授权的权限设置。')}
 else if(action==='review-plan'){panelOpen=true;expandedRow=0;render();document.querySelector('.context-scroll')?.scrollTo({top:240,behavior:'smooth'});notify('可以点击右侧的任意操作，查看完整源路径与目标路径。')}
 else if(action==='expand-plan'){const idx=Number(target.dataset.index);const scroll=document.querySelector('.context-scroll')?.scrollTop??0;expandedRow=expandedRow===idx?null:idx;render();document.querySelector('.context-scroll')?.scrollTo({top:scroll});}
 else if(action==='show-location'){notify('真实产品会通过受控的 Electron IPC 在系统文件管理器定位文件。')}
 else if(action==='panel-info'){notify('右侧上下文面板随 Agent 真实执行状态变化。')}
 else if(action==='toggle-panel'){panelOpen=!panelOpen;render();}
});
document.addEventListener('keydown',e=>{const tag=e.target?.tagName;if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;const map={'1':'welcome','2':'chat','3':'analyzing','4':'approval','5':'completed','6':'files'};if(map[e.key])setView(map[e.key])});
render();

window.__bubuSetView=setView;
